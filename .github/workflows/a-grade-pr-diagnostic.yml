name: A-grade PR diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run targeted A-grade contracts
        id: tests
        continue-on-error: true
        run: |
          npm run apply:v3-entry >/tmp/apply.log 2>&1 || { cat /tmp/apply.log; exit 1; }
          node scripts/apply_ict_a_grade_precision.mjs >/tmp/agrade-patch.log 2>&1 || { cat /tmp/agrade-patch.log; exit 1; }
          node --test server/ictAGradePrecision.test.js server/ftmoIctExecutionRouter.test.js server/ictAutoTradeQualification.test.js > /tmp/a-grade-test.log 2>&1
      - name: Comment diagnostic failure
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### A-grade targeted diagnostic'
            echo '```text'
            tail -180 /tmp/apply.log 2>/dev/null || true
            tail -180 /tmp/agrade-patch.log 2>/dev/null || true
            tail -240 /tmp/a-grade-test.log 2>/dev/null || true
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
          exit 1
