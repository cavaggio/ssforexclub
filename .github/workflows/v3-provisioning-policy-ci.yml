name: V3 provisioning policy CI

on:
  pull_request:
    paths:
      - 'server/primaryTimeframeAlignment.js'
      - 'server/primaryTimeframeAlignment.test.js'
      - 'server/v3NativeAutoTrade.js'
      - 'web/lib/v3ScanDisplayPolicy.js'
      - 'web/lib/v3ScanDisplayPolicy.test.js'
      - 'web/lib/edgeExecutionProfile.js'
      - 'web/lib/edgeExecutionProfile.test.js'
      - 'web/lib/accountEdgeExecutionProfile.ts'
      - 'web/app/api/scanner/scan/route.ts'
      - 'web/app/api/cron/auto-ai-trading/route.ts'
      - '.github/workflows/v3-provisioning-policy-ci.yml'
  push:
    branches:
      - main
      - fix/v3-provisioning-alignment-diagnostics
    paths:
      - 'server/primaryTimeframeAlignment.js'
      - 'server/primaryTimeframeAlignment.test.js'
      - 'server/v3NativeAutoTrade.js'
      - 'web/lib/v3ScanDisplayPolicy.js'
      - 'web/lib/v3ScanDisplayPolicy.test.js'
      - 'web/lib/edgeExecutionProfile.js'
      - 'web/lib/edgeExecutionProfile.test.js'
      - 'web/lib/accountEdgeExecutionProfile.ts'
      - 'web/app/api/scanner/scan/route.ts'
      - 'web/app/api/cron/auto-ai-trading/route.ts'
      - '.github/workflows/v3-provisioning-policy-ci.yml'

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check server/primaryTimeframeAlignment.js
          node --check server/v3NativeAutoTrade.js
          node --check web/lib/v3ScanDisplayPolicy.js
          node --check web/lib/edgeExecutionProfile.js
      - name: Policy regression tests
        run: >-
          node --test
          server/primaryTimeframeAlignment.test.js
          web/lib/v3ScanDisplayPolicy.test.js
          web/lib/edgeExecutionProfile.test.js

  web-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
