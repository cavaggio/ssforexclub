name: Commit generated engine isolation

on:
  push:
    branches:
      - agent/v3-engine-isolation-remove-legacy

permissions:
  contents: write

concurrency:
  group: commit-engine-isolation-generated
  cancel-in-progress: false

jobs:
  commit-generated:
    if: ${{ !contains(github.event.head_commit.message, '[generated isolation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v3-engine-isolation-remove-legacy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run apply:v3-entry
      - name: Verify generated source syntax
        run: |
          node --check server/index.js
          node --check server/oandaTrade.js
          node --check server/oandaActiveTradeMonitor.js
          node --check server/oandaActiveTradeReassessor.js
          node --check server/v3AutoTrade.js
          node --check server/v3IndependentScanner.js
          node --check server/v3DashboardScan.js
          node --check server/v3Engine.js
          node --check server/v3MarketMovement.js
      - name: Commit authoritative generated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/index.js \
            server/oandaTrade.js \
            server/oandaActiveTradeMonitor.js \
            server/oandaActiveTradeReassessor.js \
            server/v3AutoTrade.js \
            server/v3IndependentScanner.js \
            server/v3DashboardScan.js \
            server/v3Engine.js \
            server/v3MarketMovement.js
          if git diff --cached --quiet; then
            echo "Generated source is already committed."
            exit 0
          fi
          git commit -m "Materialize isolated engine source [generated isolation]"
          git push origin HEAD:agent/v3-engine-isolation-remove-legacy
