name: ICT policy diagnostic

on:
  pull_request:
    paths:
      - 'scripts/apply_ict_entry_policy.mjs'
      - 'scripts/apply_ict_lifecycle_alignment.mjs'
      - 'server/ictPolicy.js'
      - 'server/ictPolicy.test.js'
      - 'server/ictClaudeAdvisor.js'
      - 'package.json'
      - '.github/workflows/ict-policy-diagnostic.yml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Clone branch and verify generation
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git clone --quiet --depth 1 --branch "$HEAD_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          npm run apply:v3-entry >/tmp/ict-first.log
          find server web -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/ict-first.sha
          npm run apply:v3-entry >/tmp/ict-second.log
          find server web -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/ict-second.sha
          echo '--- SECOND-RUN CHANGES ---'
          diff -u /tmp/ict-first.sha /tmp/ict-second.sha || true
          changed=$(diff -u /tmp/ict-first.sha /tmp/ict-second.sha | awk '/^[+-][0-9a-f]/{print $3}' | sort -u)
          for file in $changed; do
            echo "CHANGED: $file"
          done
          test -z "$changed"
          node --test server/ictPolicy.test.js
