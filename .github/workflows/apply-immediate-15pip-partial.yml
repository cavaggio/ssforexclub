name: Validate immediate 15 pip partial stream

on:
  push:
    branches:
      - agent/immediate-15pip-partial-stream

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/immediate-15pip-partial-stream
          fetch-depth: 0

      - name: Install server dependencies
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Apply event-driven partial integration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_immediate_partial_stream.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/v3ActiveTradeMonitor.js')
          text = path.read_text(encoding='utf-8')
          old = "    units: Math.abs(units),\n    entryPrice,"
          new = "    units: Math.abs(units),\n    initialUnits: Math.abs(Number(oandaTrade.initialUnits ?? historyRecord?.units ?? units)),\n    entryPrice,"
          if new not in text:
              if text.count(old) != 1:
                  raise RuntimeError(f'V3 initial-units anchor count={text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate runtime source enforcement
        shell: bash
        run: |
          set -euo pipefail
          node --check server/oandaImmediatePartial.js
          node --check server/oandaExitManager.js
          node --check server/oandaTrade.js
          node --check server/oandaActiveTradeReassessor.js
          node --check server/v3ActiveTradeMonitor.js
          python3 -m py_compile scripts/apply_immediate_partial_stream.py

          npm run prestart

          python3 - <<'PY'
          from pathlib import Path
          immediate = Path('server/oandaImmediatePartial.js').read_text()
          exitm = Path('server/oandaExitManager.js').read_text()
          trade = Path('server/oandaTrade.js').read_text()
          reassess = Path('server/oandaActiveTradeReassessor.js').read_text()
          v3 = Path('server/v3ActiveTradeMonitor.js').read_text()
          route = Path('web/app/api/cron/active-trade-management/route.ts').read_text()
          assert 'pricing/stream?instruments=' in immediate
          assert 'IMMEDIATE_PARTIAL_TRIGGER_PIPS = 15.0' in immediate
          assert 'partialInFlight' in immediate
          assert "partialTriggerMode: 'oanda_pricing_stream_with_poll_disconnect_fallback'" in exitm
          assert 'streamOwnsTrigger' in exitm
          assert 'registerImmediatePartialTrade' in trade
          assert 'IMMEDIATE_PARTIAL_STREAM_REGISTER' in trade
          assert 'syncImmediatePartialTrades(openTrades, { client })' in reassess
          assert 'initialUnits: Math.abs(Number(oandaTrade.initialUnits' in reassess
          assert 'initialUnits: Math.abs(Number(oandaTrade.initialUnits' in v3
          assert 'PARTIAL_STREAM_CONFIRMED' in route
          assert 'brokerAlreadyPartiallyReduced' in route
          PY

      - name: Run focused server tests
        run: |
          node --test \
            server/oandaImmediatePartial.test.js \
            server/oandaTradeProtection.test.js \
            server/ictRiskRewardFloor.test.js \
            server/pprExecutionPolicy.test.js \
            server/v3EngineIsolation.test.js \
            web/lib/activeExitPolicy.test.js

      - name: Typecheck web route
        working-directory: web
        run: ./node_modules/.bin/tsc --noEmit

      - name: Recreate only intended source diff
        shell: bash
        run: |
          set -euo pipefail
          # Startup generators intentionally verify/normalize many compatibility
          # files. Drop that unrelated drift, then reapply only this feature.
          rm -f .git/index.lock
          mapfile -t changed < <(git diff --name-only)
          for file in "${changed[@]}"; do
            [ -z "$file" ] && continue
            rm -f .git/index.lock
            git checkout -- "$file"
          done
          rm -f .git/index.lock

          python3 scripts/apply_immediate_partial_stream.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/v3ActiveTradeMonitor.js')
          text = path.read_text(encoding='utf-8')
          old = "    units: Math.abs(units),\n    entryPrice,"
          new = "    units: Math.abs(units),\n    initialUnits: Math.abs(Number(oandaTrade.initialUnits ?? historyRecord?.units ?? units)),\n    entryPrice,"
          if new not in text:
              if text.count(old) != 1:
                  raise RuntimeError(f'V3 initial-units anchor count={text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          node --check server/oandaImmediatePartial.js
          node --check server/oandaExitManager.js
          node --check server/oandaTrade.js
          node --check server/oandaActiveTradeReassessor.js
          node --check server/v3ActiveTradeMonitor.js
          node --test server/oandaImmediatePartial.test.js server/v3EngineIsolation.test.js web/lib/activeExitPolicy.test.js

          allowed='server/oandaImmediatePartial.js server/oandaExitManager.js server/oandaTrade.js server/oandaActiveTradeReassessor.js server/v3ActiveTradeMonitor.js web/app/api/cron/active-trade-management/route.ts'
          echo 'Final intended diff:'
          git diff --name-only
          for file in $(git diff --name-only); do
            case " $allowed " in
              *" $file "*) ;;
              *) echo "Unexpected file remains changed: $file" >&2; exit 1 ;;
            esac
          done

      - name: Commit production integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .git/index.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/oandaImmediatePartial.js \
            server/oandaExitManager.js \
            server/oandaTrade.js \
            server/oandaActiveTradeReassessor.js \
            server/v3ActiveTradeMonitor.js \
            web/app/api/cron/active-trade-management/route.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Trigger partial profit from OANDA price stream'
          git push origin HEAD:agent/immediate-15pip-partial-stream
