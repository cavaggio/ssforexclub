name: Materialize engine isolation

on:
  push:
    branches:
      - agent/v3-engine-isolation-remove-legacy
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/materialize-engine-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run authoritative generator
        id: generate
        shell: bash
        run: |
          set +e
          npm run apply:v3-entry > isolation-generation.log 2>&1
          status=$?
          tail -n 250 isolation-generation.log > isolation-tail.log
          git diff --binary > generated-isolation.patch
          printf '%s\n' "$status" > isolation-exit-code.txt
          exit "$status"
      - name: Syntax-check generated boundaries
        if: success()
        run: |
          node --check server/autoAiRouter.js
          node --check server/v3Engine.js
          node --check server/v3ExecutionBoundary.js
          node --check server/v3TradeExecution.js
          node --check server/v3ActiveTradeMonitor.js
          node --check server/oandaActiveTradeMonitor.js
          node --check server/oandaActiveTradeReassessor.js
          node --check server/index.js
      - name: Upload generated source and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-isolation-materialized
          if-no-files-found: error
          retention-days: 3
          path: |
            isolation-generation.log
            isolation-tail.log
            isolation-exit-code.txt
            generated-isolation.patch
            server/autoAiRouter.js
            server/v3Engine.js
            server/v3IndependentScanner.js
            server/v3AutoTrade.js
            server/v3ExecutionBoundary.js
            server/v3TradeExecution.js
            server/v3ActiveTradeMonitor.js
            server/v3DashboardScan.js
            server/oandaActiveTradeMonitor.js
            server/oandaActiveTradeReassessor.js
            server/oandaTrade.js
            server/index.js
