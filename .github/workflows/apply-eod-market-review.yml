name: Apply end-of-day market review policy

on:
  push:
    branches:
      - agent/end-of-day-market-review
    paths:
      - scripts/apply_end_of_day_market_review.mjs
      - .github/workflows/apply-eod-market-review.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/end-of-day-market-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration
        run: node scripts/apply_end_of_day_market_review.mjs
      - name: Validate diff
        run: git diff --check
      - name: Run focused tests
        run: node --test server/ictAutoScheduler.test.js server/autoAiRouter.test.js scripts/apply_scan_rejection_diagnostics.test.mjs
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/ictAutoScheduler.js server/autoAiRouter.js web/app/api/cron/auto-ai-trading-extended/route.ts scripts/apply_scan_rejection_diagnostics.mjs server/ictAutoScheduler.test.js server/autoAiRouter.test.js scripts/apply_scan_rejection_diagnostics.test.mjs docs/signal-learning-pipeline.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Move market and trade review to 5:30 PM ET"
            git push origin HEAD:agent/end-of-day-market-review
          fi
