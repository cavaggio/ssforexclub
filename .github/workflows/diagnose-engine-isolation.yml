name: Diagnose engine isolation

on:
  push:
    branches:
      - agent/v3-engine-isolation-remove-legacy
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/diagnose-engine-isolation.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Capture generator and isolation tests
        shell: bash
        run: |
          set +e
          npm run apply:v3-entry > generation.log 2>&1
          printf '%s\n' "$?" > generation-exit.txt
          node --test \
            server/v3IndependentScanner.test.js \
            server/v3DashboardScan.test.js \
            server/v3EntryContract.integration.test.js \
            server/v3EngineIsolation.test.js > v3-tests.log 2>&1
          printf '%s\n' "$?" > v3-tests-exit.txt
          node --test \
            server/ictExecution.test.js \
            server/ictExecutionPaper.test.js \
            server/ictIndependence.test.js > ict-tests.log 2>&1
          printf '%s\n' "$?" > ict-tests-exit.txt
          npm test > full-tests.log 2>&1
          printf '%s\n' "$?" > full-tests-exit.txt
          tail -n 300 generation.log > generation-tail.log
          tail -n 300 v3-tests.log > v3-tests-tail.log
          tail -n 300 ict-tests.log > ict-tests-tail.log
          tail -n 500 full-tests.log > full-tests-tail.log
          git diff --binary > reapplied.patch
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: engine-isolation-diagnostics
          retention-days: 2
          path: |
            generation.log
            generation-tail.log
            generation-exit.txt
            v3-tests.log
            v3-tests-tail.log
            v3-tests-exit.txt
            ict-tests.log
            ict-tests-tail.log
            ict-tests-exit.txt
            full-tests.log
            full-tests-tail.log
            full-tests-exit.txt
            reapplied.patch
