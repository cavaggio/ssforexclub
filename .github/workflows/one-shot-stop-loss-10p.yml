name: One-shot 10 pip stop loss hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-stop-loss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch authoritative execution geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/oandaTrade.js')
          s = p.read_text()
          s = s.replace('const FIXED_FOREX_STOP_LOSS_PIPS = 20.0;', 'const FIXED_FOREX_STOP_LOSS_PIPS = 10.0;', 1)
          s = s.replace('const FIXED_FOREX_TAKE_PROFIT_PIPS = 20.0;', 'const FIXED_FOREX_TAKE_PROFIT_PIPS = 15.0;', 1)
          s = s.replace("executionLog.push(logEntry('FIXED_20P_FILL_REANCHOR', {", "executionLog.push(logEntry('FIXED_10P_FILL_REANCHOR', {", 1)
          s = s.replace("sizing.riskReward = 1.0;\n      executionLog.push(logEntry('FIXED_10P_FILL_REANCHOR', {", "sizing.riskReward = 1.5;\n      executionLog.push(logEntry('FIXED_10P_FILL_REANCHOR', {", 1)
          p.write_text(s)
          p = Path('.env.example')
          s = p.read_text().replace('FOREX_FIXED_STOP_LOSS_PIPS=20', 'FOREX_FIXED_STOP_LOSS_PIPS=10', 1)
          p.write_text(s)
          p = Path('src/components/ForexSignalStackTab.tsx')
          if p.exists():
              p.write_text(p.read_text().replace('fixed 20p / 60p / 1:3', 'fixed 10p / 15p / 1.5R'))
          PY

      - name: Verify
        run: |
          grep -q 'FIXED_FOREX_STOP_LOSS_PIPS = 10.0' server/oandaTrade.js
          grep -q 'FIXED_FOREX_TAKE_PROFIT_PIPS = 15.0' server/oandaTrade.js
          grep -q 'FIXED_10P_FILL_REANCHOR' server/oandaTrade.js
          grep -q 'sizing.riskReward = 1.5' server/oandaTrade.js
          grep -q 'FOREX_FIXED_STOP_LOSS_PIPS=10' .env.example

      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/oandaTrade.js .env.example src/components/ForexSignalStackTab.tsx .github/workflows/one-shot-stop-loss-10p.yml
          git commit -m 'chore: apply 10 pip stop loss hardening'
          git rm .github/workflows/one-shot-stop-loss-10p.yml
          git commit --amend --no-edit
          git push
