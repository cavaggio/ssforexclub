name: Generate PPR source artifact

on:
  push:
    branches:
      - fix/ppr-80-live-counts
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run apply:v3-entry
      - uses: actions/upload-artifact@v4
        with:
          name: ppr-generated-source
          path: |
            server/pprEngine.js
            server/oandaTrade.js
            server/pprAutoTrade.js
          if-no-files-found: error
