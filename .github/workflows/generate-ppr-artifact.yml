name: Generate PPR source artifact

on:
  push:
    branches:
      - fix/ppr-80-live-counts
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ppr-80-live-counts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run apply:v3-entry
      - name: Generate dashboard source and capture diagnostics
        shell: bash
        run: |
          mkdir -p debug
          set +e
          (
            cd web
            npm ci
            npm run apply:ppr
            npm run apply:ppr
          ) > debug/web-apply.log 2>&1
          status=$?
          echo "web_apply_status=$status" >> debug/web-apply.log
          exit 0
      - name: Commit generated source
        shell: bash
        run: |
          git add server/pprEngine.js server/oandaTrade.js server/pprAutoTrade.js web debug/web-apply.log
          if git diff --cached --quiet; then
            echo "Generated source is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Commit generated PPR server and dashboard source"
          git push origin HEAD:fix/ppr-80-live-counts
      - uses: actions/upload-artifact@v4
        with:
          name: ppr-generated-source
          path: |
            server/pprEngine.js
            server/oandaTrade.js
            server/pprAutoTrade.js
            web/lib/scannerEngine.js
            web/components/scanner-status-card.tsx
            debug/web-apply.log
          if-no-files-found: error
