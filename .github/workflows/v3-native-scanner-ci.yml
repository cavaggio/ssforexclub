name: V3 native scanner CI

on:
  pull_request:
    paths:
      - 'server/v3Engine.js'
      - 'server/v3QualityConfirmation.js'
      - 'server/v3QualityConfirmation.test.js'
      - 'server/v3RetestExecutionPolicy.test.js'
      - 'server/v3TpConfidence.js'
      - 'server/v3NativeEntryTiming.js'
      - 'server/v3NativeEntryTiming.test.js'
      - 'server/v3WatchClassification.js'
      - 'server/v3WatchClassification.test.js'
      - 'server/v3NativeScanner.js'
      - 'server/v3NativeAutoTrade.js'
      - 'server/v3PrimaryAlignment.js'
      - 'server/v3NativeScanner.test.js'
      - 'server/v3PrimaryAlignment.test.js'
      - 'server/ictAutoScheduler.js'
      - 'server/ictAutoScheduler.test.js'
      - 'server/autoAiRouter.js'
      - 'web/lib/autoAiActiveTradePolicy.js'
      - 'web/lib/autoAiActiveTradePolicy.test.js'
      - 'web/app/api/cron/auto-ai-trading/route.ts'
      - 'web/app/api/cron/oanda-active-trade-management/route.ts'
      - '.env.example'
      - '.github/workflows/v3-native-scanner-ci.yml'
  push:
    branches:
      - main
      - feature/v3-native-12-pair-scanner
      - fix/v3-retest-hot-watch
      - fix/v3-stage1-min-score-62
      - fix/v3-retest-execution-path
      - feature/auto-ai-entry-2pm-exit-5pm
    paths:
      - 'server/v3Engine.js'
      - 'server/v3QualityConfirmation.js'
      - 'server/v3QualityConfirmation.test.js'
      - 'server/v3RetestExecutionPolicy.test.js'
      - 'server/v3TpConfidence.js'
      - 'server/v3NativeEntryTiming.js'
      - 'server/v3NativeEntryTiming.test.js'
      - 'server/v3WatchClassification.js'
      - 'server/v3WatchClassification.test.js'
      - 'server/v3NativeScanner.js'
      - 'server/v3NativeAutoTrade.js'
      - 'server/v3PrimaryAlignment.js'
      - 'server/v3NativeScanner.test.js'
      - 'server/v3PrimaryAlignment.test.js'
      - 'server/ictAutoScheduler.js'
      - 'server/ictAutoScheduler.test.js'
      - 'server/autoAiRouter.js'
      - 'web/lib/autoAiActiveTradePolicy.js'
      - 'web/lib/autoAiActiveTradePolicy.test.js'
      - 'web/app/api/cron/auto-ai-trading/route.ts'
      - 'web/app/api/cron/oanda-active-trade-management/route.ts'
      - '.env.example'
      - '.github/workflows/v3-native-scanner-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check server/v3Engine.js
          node --check server/v3QualityConfirmation.js
          node --check server/v3TpConfidence.js
          node --check server/v3NativeEntryTiming.js
          node --check server/v3WatchClassification.js
          node --check server/v3PrimaryAlignment.js
          node --check server/v3NativeScanner.js
          node --check server/v3NativeAutoTrade.js
          node --check server/ictAutoScheduler.js
          node --check server/autoAiRouter.js
          node --check web/lib/autoAiActiveTradePolicy.js
      - name: Focused V3 and Auto AI policy tests
        run: >-
          node --test
          server/v3QualityConfirmation.test.js
          server/v3RetestExecutionPolicy.test.js
          server/v3NativeEntryTiming.test.js
          server/v3WatchClassification.test.js
          server/v3PrimaryAlignment.test.js
          server/v3NativeScanner.test.js
          server/ictAutoScheduler.test.js
          server/autoAiRouter.test.js
          web/lib/autoAiActiveTradePolicy.test.js
