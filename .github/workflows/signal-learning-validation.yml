name: Signal learning validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/lib/signalLearning*'
      - 'web/lib/pairPlaybookAdvisor.ts'
      - 'web/components/signal-learning-panel.tsx'
      - 'web/app/api/edge-intelligence/learning/**'
      - 'web/app/api/cron/edge-learning-refresh/**'
      - 'web/app/api/cron/auto-ai-trading-extended/route.ts'
      - 'web/app/dashboard/edge-intelligence/page.tsx'
      - 'supabase/migrations/20260727210000_signal_learning_pipeline.sql'
      - '.github/workflows/signal-learning-validation.yml'

permissions:
  contents: read

jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install root dependencies
        run: npm ci --ignore-scripts >/dev/null
      - name: Test deterministic learning core
        run: node --test web/lib/signalLearningCore.test.js
      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts >/dev/null
      - name: Typecheck learning dashboard
        id: typecheck
        continue-on-error: true
        working-directory: web
        shell: bash
        run: |
          npm run typecheck > /tmp/signal-learning-typecheck.log 2>&1
          status=$?
          echo "$status" > /tmp/signal-learning-typecheck.exit
          cat /tmp/signal-learning-typecheck.log
          exit "$status"
      - name: Build learning dashboard
        id: build
        if: steps.typecheck.outcome == 'success'
        continue-on-error: true
        working-directory: web
        shell: bash
        run: |
          npm run build > /tmp/signal-learning-build.log 2>&1
          status=$?
          echo "$status" > /tmp/signal-learning-build.exit
          cat /tmp/signal-learning-build.log
          exit "$status"
      - name: Upload learning validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-learning-validation-logs
          path: |
            /tmp/signal-learning-typecheck.log
            /tmp/signal-learning-typecheck.exit
            /tmp/signal-learning-build.log
            /tmp/signal-learning-build.exit
          if-no-files-found: ignore
          retention-days: 5
      - name: Fail on typecheck error
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - name: Fail on build error
        if: steps.build.outcome == 'failure'
        run: exit 1
