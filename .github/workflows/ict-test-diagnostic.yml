name: ICT test diagnostic

on:
  pull_request:
    paths:
      - 'server/**'
      - 'web/lib/**'
      - 'scripts/apply_ict_entry_policy.mjs'
      - 'scripts/apply_ict_lifecycle_alignment.mjs'
      - 'scripts/apply_ict_execution_alignment.py'
      - 'scripts/apply_ict_rr_floor.py'
      - 'package.json'
      - '.github/workflows/ict-test-diagnostic.yml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Run full tests with compact failure output
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git clone --quiet --depth 1 --branch "$HEAD_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          npm ci --ignore-scripts >/dev/null
          if ! npm test >/tmp/full-test.log 2>&1; then
            echo '=== FAILURE INDEX ==='
            grep -nE 'not ok|ERR_ASSERTION|testCodeFailure|Error:|FAIL' /tmp/full-test.log | tail -120 || true
            echo '=== LOG TAIL ==='
            tail -350 /tmp/full-test.log
            exit 1
          fi
          echo 'FULL TEST SUITE PASSED'
