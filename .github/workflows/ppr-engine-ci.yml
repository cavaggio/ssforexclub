name: Validate independent PPR engine

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ppr-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install server dependencies
        run: npm ci
      - name: Apply authoritative generated source twice
        run: |
          npm run apply:v3-entry
          npm run apply:v3-entry
      - name: Test PPR scanner and manipulation logic
        run: node --test server/pprEngine.test.js
      - name: Test PPR execution policy and source isolation
        run: node --test server/pprExecutionPolicy.test.js
      - name: Test PPR diagnostic-only confidence isolation
        run: node --test server/pprConfidenceDiagnostic.test.js
      - name: Syntax-check generated shared OANDA executor
        run: node --check server/oandaTrade.js
      - name: Import generated shared OANDA executor
        run: node --input-type=module -e "await import('./server/oandaTrade.js')"
      - name: Import PPR execution adapter
        run: node --input-type=module -e "await import('./server/pprExecution.js')"
      - name: Import three-engine router
        run: node --input-type=module -e "await import('./server/autoAiRouter.js')"
      - name: Router disabled selection
        run: node --test --test-name-pattern="disabled toggle" server/autoAiRouter.test.js
      - name: Router preserves all three engines
        run: node --test --test-name-pattern="enabled preserves" server/autoAiRouter.test.js
      - name: Router invalid selection fallback
        run: node --test --test-name-pattern="missing/invalid" server/autoAiRouter.test.js
      - name: Router selects exactly one engine
        run: node --test --test-name-pattern="each selection" server/autoAiRouter.test.js
      - name: Router never invokes two engines
        run: node --test --test-name-pattern="never runs more than one" server/autoAiRouter.test.js
      - name: Router enforces time and weekday boundary
        run: node --test --test-name-pattern="blocks all engines" server/autoAiRouter.test.js
      - name: Verify ICT execution remains unchanged
        run: node --test server/ictExecution.test.js
      - name: Verify ICT remains independent from V3
        run: node --test server/ictIndependence.test.js
      - name: Verify V3 execution contract remains valid
        run: node --test server/v3EntryContract.integration.test.js
      - name: Regression group A — lifecycle and base scanner
        run: >-
          node --test
          server/oandaTradeLifecycleEngine.test.js
          server/oandaCalibration.test.js
          server/oandaClose.test.js
          web/lib/sanitizePayload.test.js
          server/oandaFibonacci.test.js
          server/v3FibEntryTiming.test.js
          server/v3MarketMovementNullSafety.test.js
          server/v3ManualExecution.test.js
          server/liquidityEngine.test.js
          server/liquidityIntent.test.js
          server/premiumDiscount.test.js
          server/marketStructureEngine.test.js
      - name: Regression group B — V3 architecture
        run: >-
          node --test
          server/sessionEngine.test.js
          server/volatilityExpansionEngine.test.js
          server/liquidityTargeting.test.js
          server/v3ExecutionModel.test.js
          server/v3ShadowLog.test.js
          server/primaryTimeframeAlignment.test.js
          server/v3QualityConfirmation.test.js
          server/v3IndependentScanner.test.js
          server/v3DashboardScan.test.js
          server/v3TimeframeClassification.test.js
          server/v3EntryContract.integration.test.js
      - name: Regression group C — ICT and risk controls
        run: >-
          node --test
          server/ictConcepts.test.js
          server/ictEngine.test.js
          server/ictExecution.test.js
          server/ictExecutionPaper.test.js
          server/ictIndependence.test.js
          server/forexFactoryNews.test.js
          server/ictLifecycleEngine.test.js
          server/ictAutoScheduler.test.js
          server/autoAiRouter.test.js
          server/autoAiRiskLimits.test.js
          server/autoAiGating.test.js
          server/riskManager.test.js
      - name: Regression D1 — providers and futures
        run: >-
          node --test
          server/providerRouting.test.js
          server/futuresSymbols.test.js
          server/ninjatraderClient.test.js
          server/topstepClient.test.js
          server/futuresNoSecretLeak.test.js
      - name: Regression D2 — OANDA trade-cap source contract
        run: node --test server/oandaTradeCap.test.js
      - name: Regression D3 — PPR scanner and routing
        run: >-
          node --test
          server/pprEngine.test.js
          server/pprExecutionPolicy.test.js
          server/pprScannerRouting.test.js
      - name: Regression D4 — dashboard helper contracts
        run: >-
          node --test
          web/lib/scannerEngine.test.js
          web/lib/futuresStatus.test.js
          web/lib/brokerDisplay.test.js

  ppr-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Apply PPR dashboard integration twice
        run: |
          npm run apply:ppr
          npm run apply:ppr
      - name: Typecheck PPR dashboard toggle, attribution and routes
        run: npm run typecheck
