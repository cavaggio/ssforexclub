name: Apply execution hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply hardening patch
        run: python3 scripts/apply_execution_hardening.py

      - name: Commit generated source to PR branch
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "No source changes required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server web/lib supabase/migrations scripts/apply_execution_hardening.py
            git commit -m "Harden execution timing, duplicate, range, and daily risk controls"
            git push origin HEAD:"${TARGET_BRANCH}"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run focused safety tests
        continue-on-error: true
        run: |
          node --test server/riskManager.test.js
          node --test server/v3QualityConfirmation.test.js
          node --test server/ictExecution.test.js

      - name: Run full server test suite
        continue-on-error: true
        run: npm test
