name: Validate execution and V3

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install server dependencies
        run: npm ci

      - name: Apply authoritative generated source
        run: npm run apply:v3-entry

      - name: Verify generation is stable
        run: npm run apply:v3-entry

      - name: Test risk controls
        run: node --test server/riskManager.test.js

      - name: Test V3 quality confirmation
        run: node --test server/v3QualityConfirmation.test.js

      - name: Test V3 timeframe classification
        run: node --test server/v3TimeframeClassification.test.js

      - name: Test dashboard Hot Watch mapping
        run: node --test --test-name-pattern="native Stage 1 pass plus Stage 2 watch" server/v3DashboardScan.test.js

      - name: Test dashboard Near Qualified mapping
        run: node --test --test-name-pattern="native Stage 1 score development" server/v3DashboardScan.test.js

      - name: Test dashboard timeframe mapping
        run: node --test --test-name-pattern="dashboard scores Daily H4 M15" server/v3DashboardScan.test.js

      - name: Test dashboard full alignment mapping
        run: node --test --test-name-pattern="100 alignment requires" server/v3DashboardScan.test.js

      - name: Test dashboard hard blocker mapping
        run: node --test --test-name-pattern="hard native blockers" server/v3DashboardScan.test.js

      - name: Test dashboard terminal Stage 2 mapping
        run: node --test --test-name-pattern="completed or terminal Stage 2" server/v3DashboardScan.test.js

      - name: Test independent V3 scanner
        run: node --test server/v3IndependentScanner.test.js

      - name: Test V3 execution contract
        run: node --test server/v3EntryContract.integration.test.js

      - name: Test ICT execution isolation
        run: node --test server/ictExecution.test.js server/ictIndependence.test.js

      - name: Run full server test suite
        run: npm test

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Typecheck dashboard
        run: npm --prefix web run typecheck
