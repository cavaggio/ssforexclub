name: Validate V3 Stage 2 contract

on:
  pull_request:
    branches:
      - agent/v3-stage2-validation-base
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply entry contract
        run: python3 scripts/run_v3_entry_contract.py
      - name: Commit generated source
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "Generated source already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server package.json scripts/apply_v3_entry_contract.py scripts/apply_v3_entry_contract_fixes.py scripts/run_v3_entry_contract.py
            git commit -m "Apply V3 Stage 2 entry contract [skip ci]"
            git push origin HEAD:"${HEAD_BRANCH}"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Syntax checks
        run: |
          node --check server/v3EntryContract.js
          node --check server/primaryTimeframeAlignment.js
          node --check server/v3QualityConfirmation.js
          node --check server/v3IndependentScanner.js
          node --check server/v3AutoTrade.js
          node --check server/oandaTrade.js
      - name: Independent V3 tests
        run: node --test server/v3IndependentScanner.test.js
      - name: Provisioning policy tests
        run: >-
          node --test
          server/primaryTimeframeAlignment.test.js
          web/lib/v3ScanDisplayPolicy.test.js
          web/lib/edgeExecutionProfile.test.js
      - name: Native V3 tests
        run: >-
          node --test
          server/v3QualityConfirmation.test.js
          server/v3RetestExecutionPolicy.test.js
          server/v3NativeEntryTiming.test.js
          server/v3WatchClassification.test.js
          server/v3PrimaryAlignment.test.js
          server/v3NativeScanner.test.js
          server/ictAutoScheduler.test.js
          server/autoAiRouter.test.js
      - name: Entry-contract integration tests
        run: node --test server/v3EntryContract.integration.test.js
      - name: Full test suite with diagnostic
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set +e
          npm test > /tmp/v3-full-suite.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "status=${status}"
              cat /tmp/v3-full-suite.log
            } > server/v3FullSuiteDiagnostics.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server/v3FullSuiteDiagnostics.txt
            git commit -m "Record V3 full-suite failure [skip ci]" || true
            git push origin HEAD:"${HEAD_BRANCH}"
          else
            rm -f server/v3FullSuiteDiagnostics.txt
            if ! git diff --quiet -- server/v3FullSuiteDiagnostics.txt; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A server/v3FullSuiteDiagnostics.txt
              git commit -m "Remove V3 full-suite diagnostic [skip ci]"
              git push origin HEAD:"${HEAD_BRANCH}"
            fi
          fi
          cat /tmp/v3-full-suite.log
          exit "$status"
      - name: Production build
        run: npm run build
