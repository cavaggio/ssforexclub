name: One-shot hard-coded scalp exit geometry repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-hardcode-scalp-exits.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'cavaggio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch authoritative scalp execution geometry
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/oandaTrade.js')
          s = p.read_text()

          replacements = {
              'const FIXED_FOREX_TAKE_PROFIT_PIPS = 15.0;': 'const FIXED_FOREX_TAKE_PROFIT_PIPS = 18.0;',
              'signal.expectedRR = 1.0;': 'signal.expectedRR = 1.5;',
              'signal.rr = 1.0;': 'signal.rr = 1.5;',
              'signal.riskReward = 1.0;': 'signal.riskReward = 1.5;',
              '`TP=${FIXED_FOREX_TAKE_PROFIT_PIPS.toFixed(1)}p RR=1.00`,': '`TP=${FIXED_FOREX_TAKE_PROFIT_PIPS.toFixed(1)}p FINAL | FIRST 80%@15p / FINAL 20%@18p`,',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing required anchor: {old}')
              s = s.replace(old, new, 1)
          if 'const FIXED_FOREX_STOP_LOSS_PIPS = 10.0;' not in s:
              raise SystemExit('10-pip stop-loss anchor missing')
          p.write_text(s)

      - name: Verify hard-coded geometry
        run: |
          grep -n "FIXED_FOREX_STOP_LOSS_PIPS\|FIXED_FOREX_TAKE_PROFIT_PIPS\|FIRST 80%@15p / FINAL 20%@18p\|signal.expectedRR\|signal.rr\|signal.riskReward" server/oandaTrade.js
          node --check server/oandaTrade.js

      - name: Commit patch and self-remove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/one-shot-hardcode-scalp-exits.yml
          git add server/oandaTrade.js .github/workflows/one-shot-hardcode-scalp-exits.yml
          git diff --cached --check
          git commit -m 'fix: hard-code scalp exit geometry'
          git push
