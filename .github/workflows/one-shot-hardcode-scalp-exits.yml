name: One-shot hard-coded scalp exit geometry repair

on:
  push:
    branches: [main]

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: hard-code scalp exit geometry'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch authoritative scalp execution geometry
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path('server/oandaTrade.js')
          s = p.read_text()

          replacements = {
              "const FIXED_FOREX_STOP_LOSS_PIPS = 10.0;": "const FIXED_FOREX_STOP_LOSS_PIPS = 10.0;",
              "const FIXED_FOREX_TAKE_PROFIT_PIPS = 15.0;": "const FIXED_FOREX_TAKE_PROFIT_PIPS = 18.0;",
              "signal.expectedRR = 1.0;": "signal.expectedRR = 1.5;",
              "signal.rr = 1.0;": "signal.rr = 1.5;",
              "signal.riskReward = 1.0;": "signal.riskReward = 1.5;",
              "`TP=${FIXED_FOREX_TAKE_PROFIT_PIPS.toFixed(1)}p RR=1.00`,": "`TP=${FIXED_FOREX_TAKE_PROFIT_PIPS.toFixed(1)}p FINAL RR=1.80 | FIRST 80%@15p / FINAL 20%@18p`,",
          }

          for old, new in replacements.items():
              if old not in s:
                  if old == replacements["const FIXED_FOREX_STOP_LOSS_PIPS = 10.0;"]:
                      continue
                  raise SystemExit(f'missing required anchor: {old}')
              s = s.replace(old, new, 1)

          if "FIXED_FOREX_TAKE_PROFIT_PIPS = 18.0" not in s:
              raise SystemExit('final broker TP is not hard-coded to 18 pips')
          if "FIRST 80%@15p / FINAL 20%@18p" not in s:
              raise SystemExit('requested 80/20 exit geometry marker missing')

          p.write_text(s)
          PY

          git diff --check
          grep -n "FIXED_FOREX_STOP_LOSS_PIPS\|FIXED_FOREX_TAKE_PROFIT_PIPS\|FIRST 80%@15p / FINAL 20%@18p\|signal.expectedRR\|signal.rr\|signal.riskReward" server/oandaTrade.js

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/oandaTrade.js
          git diff --cached --quiet && { echo 'No changes required'; exit 0; }
          git commit -m "fix: hard-code scalp exit geometry"
          git push origin main

      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-hardcode-scalp-exits.yml
          git add -u .github/workflows/one-shot-hardcode-scalp-exits.yml
          git commit -m "chore: remove one-shot scalp exit repair workflow"
          git push origin main
