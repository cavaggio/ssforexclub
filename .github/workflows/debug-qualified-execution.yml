name: Debug qualified execution

on:
  push:
    branches:
      - fix/execute-every-qualified-trade
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run apply:v3-entry
      - name: Run focused contract
        run: node --test server/qualifiedExecutionContract.test.js
      - name: Run full suite
        id: full_suite
        shell: bash
        run: |
          set +e
          npm test > /tmp/full-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save concise test diagnostics
        if: always()
        shell: bash
        run: |
          tail -n 400 /tmp/full-test.log > /tmp/full-test-tail.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualified-execution-test-log
          path: /tmp/full-test-tail.log
          if-no-files-found: error
      - name: Fail when full suite failed
        if: steps.full_suite.outputs.status != '0'
        run: |
          cat /tmp/full-test-tail.log
          exit 1
