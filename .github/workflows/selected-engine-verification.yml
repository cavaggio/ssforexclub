name: Selected Engine Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/**'
      - 'web/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - fix/selected-engine-0215-entry-gate

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
