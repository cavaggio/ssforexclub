name: Fixed Risk Policy

on:
  push:
    branches:
      - agent/enforce-1-25-risk-20-pip-sl
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/enforce_fixed_risk_20pip.py'
      - 'scripts/run_fixed_risk_policy.py'
      - 'package.json'
      - '.github/workflows/fixed-risk-policy.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply generated source policies
        id: generate
        continue-on-error: true
        run: npm run apply:v3-entry > generation.log 2>&1
      - name: Upload generation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-risk-generation-log
          path: generation.log
          retention-days: 3
      - name: Require successful generation
        if: steps.generate.outcome != 'success'
        run: |
          tail -n 40 generation.log
          exit 1
      - name: Commit authoritative generated source
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- server/riskManager.js server/oandaRiskSizing.js server/oandaTrade.js server/ictExecution.js; then
            echo 'Authoritative execution source is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/riskManager.js server/oandaRiskSizing.js server/oandaTrade.js server/ictExecution.js
          git commit -m 'Materialize fixed 1.25 percent risk policy'
          git push origin HEAD:agent/enforce-1-25-risk-20-pip-sl
      - name: Fixed policy unit tests
        run: node --test server/fixedTradeRiskPolicy.test.js
      - name: Central risk manager tests
        run: node --test server/riskManager.test.js
      - name: ICT execution tests
        run: node --test server/ictExecution.test.js
      - name: ICT paper execution tests
        run: node --test server/ictExecutionPaper.test.js
      - name: OANDA trade cap tests
        run: node --test server/oandaTradeCap.test.js
