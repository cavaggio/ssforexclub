name: Repair OANDA executor 10p

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore authoritative executor and harden 10p references
        shell: bash
        run: |
          set -euo pipefail
          git checkout 4ff01db45d6dfe2d192858da9afccca4bb1db5ec -- server/oandaTrade.js
          python - <<'PY'
          from pathlib import Path
          p = Path('server/oandaTrade.js')
          s = p.read_text()
          s = s.replace('both are exactly 20.0 pips when accepted.', 'the forex SL is exactly 10.0 pips when accepted and the TP is exactly 15.0 pips.')
          s = s.replace("riskReward: 1.0,", "riskReward: 1.5,")
          s = s.replace("FIXED_20P_FILL_REANCHOR_FAILED", "FIXED_10P_FILL_REANCHOR_FAILED")
          if 'const FIXED_FOREX_STOP_LOSS_PIPS = 10.0;' not in s:
              raise SystemExit('10 pip SL constant missing')
          if 'const FIXED_FOREX_TAKE_PROFIT_PIPS = 15.0;' not in s:
              raise SystemExit('15 pip TP constant missing')
          p.write_text(s)
          PY
          grep -F 'const FIXED_FOREX_STOP_LOSS_PIPS = 10.0;' server/oandaTrade.js
          grep -F 'const FIXED_FOREX_TAKE_PROFIT_PIPS = 15.0;' server/oandaTrade.js
          grep -F "FIXED_10P_FILL_REANCHOR" server/oandaTrade.js
          node --check server/oandaTrade.js

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/oandaTrade.js .github/workflows/repair-oanda-trade-10p.yml
          git commit -m 'fix: restore OANDA executor with 10 pip stop loss'
          git rm .github/workflows/repair-oanda-trade-10p.yml
          git commit --amend --no-edit
          git push
