name: Commit final engine isolation source

on:
  push:
    branches:
      - agent/v3-engine-isolation-remove-legacy

permissions:
  contents: write

concurrency:
  group: commit-final-engine-isolation-source
  cancel-in-progress: false

jobs:
  commit-generated:
    if: ${{ !contains(github.event.head_commit.message, '[final generated isolation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v3-engine-isolation-remove-legacy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run apply:v3-entry
      - run: |
          node --check server/index.js
          node --check server/ictExecution.js
      - name: Commit generated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js server/ictExecution.js
          if git diff --cached --quiet; then
            echo "Generated source is already committed."
            exit 0
          fi
          git commit -m "Materialize final isolated source [final generated isolation]"
          git push origin HEAD:agent/v3-engine-isolation-remove-legacy
